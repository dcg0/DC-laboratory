name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-security:
    name: Static security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect likely secrets in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          begin_word='BEGIN'
          dash_prefix='-----'
          gh_prefix='gh'
          patterns="$begin_word (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|${gh_prefix}[pousr]_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{35}|${dash_prefix}${begin_word}"
          if git grep -n -I -E "$patterns" -- . ':!SECURITY.md'; then
            echo 'Potential secret detected. Remove it and rotate it before merging.' >&2
            exit 1
          fi

      - name: Verify published download checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s downloads/DCA-ChromeOS.apk
          test -s downloads/DCA-ChromeOS.apk.sha256
          sha256sum -c downloads/DCA-ChromeOS.apk.sha256

      - name: Check for unsafe external target links
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.html' 'target="_blank"' . | grep -v 'rel="noopener"'; then
            echo 'Every target=_blank link must include rel="noopener".' >&2
            exit 1
          fi

      - name: Verify security metadata on every published HTML page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = (
              'http-equiv="Content-Security-Policy"',
              'name="referrer"',
              'http-equiv="X-Content-Type-Options"',
              'http-equiv="Permissions-Policy"',
          )
          pages = sorted(
              path for path in Path('.').rglob('*.html')
              if '.git' not in path.parts and 'node_modules' not in path.parts
          )
          if not pages:
              raise SystemExit('No published HTML pages found')
          failures = []
          for page in pages:
              text = page.read_text(encoding='utf-8', errors='strict')
              missing = [item for item in required if item.lower() not in text.lower()]
              if missing:
                  failures.append(f'{page}: missing {", ".join(missing)}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit('Security metadata check failed')
          print(f'Security metadata present on {len(pages)} HTML pages')
          PY

      - name: Verify vulnerability reporting file
        shell: bash
        run: |
          set -euo pipefail
          test -s .well-known/security.txt
          grep -q '^Contact: https://github.com/dcg0/DC-laboratory/security/advisories/new$' .well-known/security.txt
